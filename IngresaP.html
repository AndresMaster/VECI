<!DOCTYPE html>
<html lang="en">  

<main>
<head>
    <meta charset="UTF-8"> <!--Se usa para que el navegador interprete correctamente-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--La idea es que se vea correctamente en ordenadores y celulares-->
    <title>Ingresar_Productos;</title> 

    <link href="style.css" rel="stylesheet">

</head> 

<body>
<!-- Esto es para poder generar un formulario y que el usuario ingrese cosas -->
<div> 
    <form action="Aqui va la dirección a la que vamos a mandar la información">
      <h2>¿Vas a ingresar o retirar un producto?</h2>
      <!--Selección de lo que se va a hacer-->
      <label for="Ingresar"><input id="Ingresar" type="radio" name="Ingresar-Retirar">Ingresar</label>
      <br>
      <label for="Retirar"><input id="Retirar" type="radio" name="Ingresar-Retirar">Retirar</label>
      <br><br>
      
      <!--Ingreso de productos-->
      <input class="input_InText" type="text" placeholder="Tus productos" required> 
      <button class="Button_Ingresarproductos" type="submit">GUARDAR 
      </button>
      <br><br>

      <!--Casillas de verificación-->

      <label><input type="checkbox" name="Se vence">¿Se vence?</label>
      <hr>

</body>
</main>
